<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 610" role="img" aria-labelledby="title desc">
  <title id="title">封面在桌面和手机尺寸下的预览对照</title>
  <desc id="desc">同一张示意图分别放入较宽画布和手机宽度画布，检查标题与留白。</desc>
  <defs><linearGradient id="cover" x2="0" y2="1"><stop stop-color="#172c4d"/><stop offset="1" stop-color="#5bb59e"/></linearGradient></defs>
  <rect width="1200" height="610" rx="28" fill="#0b111d"/>
  <text x="56" y="71" fill="#f3f7ff" font-size="34" font-family="PingFang SC, Microsoft YaHei, sans-serif">同一张图，两种阅读尺寸</text>
  <text x="59" y="110" fill="#9eafc6" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">检查裁切、标题可读性和四周留白</text>
  <rect x="58" y="147" width="512" height="395" rx="22" fill="#101b2a" stroke="#304565" stroke-width="2"/>
  <text x="85" y="185" fill="#9eafc6" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">较宽画布</text>
  <rect x="85" y="202" width="458" height="302" rx="8" fill="url(#cover)"/>
  <circle cx="448" cy="261" r="58" fill="#78dfc2" opacity=".8"/>
  <rect x="110" y="221" width="408" height="263" rx="10" fill="none" stroke="#d9fff3" stroke-width="2"/>
  <rect x="111" y="382" width="407" height="88" rx="12" fill="#070d16"/>
  <text x="132" y="417" fill="#fff" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif">手机上看，封面字清楚吗？</text>
  <rect x="632" y="147" width="512" height="395" rx="22" fill="#101b2a" stroke="#304565" stroke-width="2"/>
  <text x="659" y="185" fill="#9eafc6" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">手机宽度</text>
  <rect x="784" y="202" width="208" height="302" rx="18" fill="#070d16" stroke="#607798" stroke-width="3"/>
  <rect x="802" y="221" width="172" height="263" rx="6" fill="url(#cover)"/>
  <circle cx="930" cy="266" r="40" fill="#78dfc2" opacity=".8"/>
  <rect x="814" y="232" width="148" height="241" rx="8" fill="none" stroke="#72e7c0" stroke-width="2"/>
  <rect x="812" y="376" width="152" height="78" rx="10" fill="#070d16"/>
  <text x="824" y="408" fill="#fff" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif">标题缩小后，</text>
  <text x="824" y="434" fill="#fff" font-size="17" font-family="PingFang SC, Microsoft YaHei, sans-serif">离边缘够远吗？</text>
  <rect x="58" y="562" width="1086" height="1" fill="#304565"/>
  <text x="61" y="591" fill="#72e7c0" font-size="19" font-family="PingFang SC, Microsoft YaHei, sans-serif">示意图：最终呈现请在抖音发布页再次检查。</text>
</svg>
