<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">封面实验室：发之前，先缩小到手机里看一眼</title>
  <desc id="desc">本地封面预览工具介绍，有图文和视频两种常见画布比例。</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0a0f18"/><stop offset="1" stop-color="#14243b"/></linearGradient>
    <linearGradient id="pic" x2="0" y2="1"><stop stop-color="#1b3155"/><stop offset="1" stop-color="#4eaa9b"/></linearGradient>
    <linearGradient id="mint"><stop stop-color="#55d6ae"/><stop offset="1" stop-color="#9ef2d1"/></linearGradient>
  </defs>
  <rect width="1200" height="675" rx="30" fill="url(#bg)"/>
  <circle cx="1040" cy="80" r="220" fill="#4a79a8" opacity=".12"/>
  <rect x="54" y="44" width="320" height="44" rx="22" fill="#102722" stroke="#316655"/>
  <text x="76" y="73" fill="#7be6c2" font-size="21" font-family="PingFang SC, Microsoft YaHei, sans-serif">作品介绍 · 本地封面预览</text>
  <text x="64" y="173" fill="#f3f7ff" font-size="54" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">发之前，先缩小到</text>
  <text x="64" y="244" fill="#7be6c2" font-size="69" font-weight="700" font-family="PingFang SC, Microsoft YaHei, sans-serif">手机里看一眼</text>
  <text x="68" y="294" fill="#a9bad2" font-size="24" font-family="PingFang SC, Microsoft YaHei, sans-serif">选图 → 裁切 → 叠标题 → 导出 PNG</text>
  <rect x="63" y="351" width="545" height="190" rx="22" fill="#111d2d" stroke="#304565"/>
  <text x="94" y="397" fill="#7be6c2" font-size="25" font-family="PingFang SC, Microsoft YaHei, sans-serif">一个小而明确的用途</text>
  <text x="94" y="443" fill="#f3f7ff" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif">让创作者先检查手机尺寸下的</text>
  <text x="94" y="478" fill="#f3f7ff" font-size="23" font-family="PingFang SC, Microsoft YaHei, sans-serif">主体裁切、标题可读性与边缘留白。</text>
  <text x="94" y="518" fill="#a9bad2" font-size="18" font-family="PingFang SC, Microsoft YaHei, sans-serif">图示为示意画面，不是抖音官方界面。</text>
  <rect x="763" y="36" width="335" height="590" rx="43" fill="#080d16" stroke="#5d7294" stroke-width="3"/>
  <rect x="783" y="60" width="295" height="544" rx="30" fill="url(#pic)"/>
  <circle cx="1005" cy="153" r="72" fill="#76dfc1" opacity=".82"/>
  <rect x="809" y="86" width="243" height="476" rx="15" fill="none" stroke="#d8fff3" stroke-width="2" opacity=".88"/>
  <rect x="810" y="384" width="242" height="143" rx="17" fill="#070c15"/>
  <text x="832" y="429" fill="#fff" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif">手机上看，</text>
  <text x="832" y="465" fill="#fff" font-size="26" font-family="PingFang SC, Microsoft YaHei, sans-serif">封面字清楚吗？</text>
  <rect x="832" y="492" width="102" height="6" rx="3" fill="#ffd36f"/>
  <rect x="64" y="573" width="540" height="56" rx="18" fill="#142a31" stroke="#315d55"/>
  <text x="91" y="609" fill="#ffd36f" font-size="20" font-family="PingFang SC, Microsoft YaHei, sans-serif">不猜流量 · 只帮你先看画面</text>
</svg>
