<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="dark">
<title>封面实验室 · 手机预览</title>
<style>
:root{--bg:#0a0f18;--panel:#111a28;--line:#26344a;--text:#f1f5fb;--muted:#9aabc0;--blue:#7aa7ff;--mint:#6ee7c0;--amber:#ffd166}
*{box-sizing:border-box}
body{margin:0;background:radial-gradient(900px 500px at 75% -20%,#233359 0,transparent 70%),var(--bg);color:var(--text);font:15px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif}
main{max-width:1120px;margin:0 auto;padding:32px 20px 56px}
header{display:flex;align-items:flex-start;justify-content:space-between;gap:20px;margin-bottom:22px}
h1{font-size:28px;line-height:1.15;margin:0 0 8px;letter-spacing:-.03em}
h1 span{color:var(--mint)}
header p{margin:0;color:var(--muted);max-width:650px}
.pill{white-space:nowrap;border:1px solid #285a51;color:var(--mint);background:#102722;border-radius:999px;padding:7px 12px;font-size:12px}
.layout{display:grid;grid-template-columns:minmax(260px,370px) minmax(300px,1fr);gap:18px;align-items:start}
.panel{background:linear-gradient(180deg,#131e2d,#0e1623);border:1px solid var(--line);border-radius:18px;padding:18px;box-shadow:0 18px 45px #0004}
.panel h2{font-size:15px;margin:0 0 14px;color:#dfe9f6}
.field{margin:14px 0}
label{display:flex;justify-content:space-between;gap:12px;align-items:center;color:#d8e1ed;font-size:13px;margin-bottom:7px}
small,.hint{color:var(--muted);font-size:12px}
input[type=file],input[type=text],select{font:inherit;color:var(--text);background:#0a111c;border:1px solid #34445c;border-radius:10px;padding:10px 11px;width:100%;outline:none}
input[type=file]{font-size:12px}
input[type=range]{width:100%;accent-color:var(--mint)}
select:focus,input:focus{border-color:var(--blue)}
.range-meta{display:flex;justify-content:space-between;color:var(--muted);font-size:11px;margin-top:3px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.segment{display:flex;gap:8px}
.ratio{flex:1;border:1px solid #34445c;background:#0a111c;color:var(--muted);border-radius:9px;padding:9px 7px;cursor:pointer}
.ratio[aria-pressed=true]{background:#183129;border-color:#4ab99c;color:#b2ffe9}
.button{border:0;border-radius:11px;padding:12px 15px;font:700 14px/1.2 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif;cursor:pointer}
.primary{width:100%;background:linear-gradient(120deg,#42d5ab,#93f2ce);color:#05251d;margin-top:8px}
.primary:disabled{opacity:.45;cursor:not-allowed}
.secondary{background:#172338;border:1px solid #34445c;color:#dce6f3}
.preview{display:grid;grid-template-columns:minmax(190px,350px) minmax(150px,1fr);gap:18px;align-items:center;justify-content:center;min-height:520px}
.canvas-wrap{width:min(100%,350px);margin:0 auto;border-radius:22px;border:1px solid #34445c;background:#070b12;overflow:hidden;box-shadow:0 20px 55px #0008}
canvas{display:block;width:100%;height:auto}
.readout{display:grid;gap:10px}
.metric{border:1px solid var(--line);border-radius:12px;background:#0c1420;padding:12px}
.metric strong{display:block;font-size:18px;margin-top:2px}
.metric .eyebrow{color:var(--muted);font-size:11px;letter-spacing:.04em}
.metric em{color:var(--mint);font-style:normal}
.metric.warn em{color:var(--amber)}
.export-note{color:var(--muted);font-size:12px;margin:12px 0 0}
.disclaimer{margin-top:17px;padding:12px 14px;border:1px solid #54452b;background:#211b11;color:#ddc68f;border-radius:12px;font-size:12px}
footer{margin-top:18px;color:#76889f;font-size:11px;text-align:center}
.drop{border:1px dashed #405675;border-radius:11px;padding:10px;background:#0c1522;transition:.15s}
.drop.over{border-color:var(--mint);background:#102820}
@media(max-width:760px){main{padding:22px 13px 40px}header{display:block}h1{font-size:24px}.pill{display:inline-block;margin-top:12px}.layout{grid-template-columns:1fr}.preview{grid-template-columns:minmax(150px,280px) 1fr;gap:12px;min-height:0}.panel{padding:14px}.readout .metric{padding:9px}.metric strong{font-size:15px}}
@media(max-width:440px){.preview{grid-template-columns:1fr;gap:10px}.readout{grid-template-columns:repeat(3,1fr)}.metric{font-size:11px}.metric strong{font-size:14px}.canvas-wrap{width:min(80vw,300px)}}
</style>
</head>
<body>
<main>
  <header>
    <div>
      <h1>封面<span>实验室</span></h1>
      <p>先把作品放进手机尺寸看一遍。调裁切、标题和留白，再导出一张能直接试用的封面。</p>
    </div>
    <span class="pill">本地处理 · 图片不会上传</span>
  </header>

  <div class="layout">
    <section class="panel" aria-label="封面设置">
      <h2>编辑封面</h2>
      <div class="field drop" id="drop">
        <label for="file">选择图片 <small>PNG / JPG / WebP，最大 15 MB</small></label>
        <input id="file" type="file" accept="image/png,image/jpeg,image/webp">
      </div>

      <div class="field">
        <label>预览比例 <small id="sizeLabel">1080 × 1440</small></label>
        <div class="segment">
          <button class="ratio" id="ratio34" aria-pressed="true">图文 3:4</button>
          <button class="ratio" id="ratio916" aria-pressed="false">视频 9:16</button>
        </div>
      </div>

      <div class="field">
        <label for="title">叠加标题 <small><span id="count">0</span>/36</small></label>
        <input id="title" type="text" maxlength="36" value="手机上看，封面字清楚吗？">
      </div>

      <div class="row">
        <div class="field">
          <label for="position">标题位置</label>
          <select id="position">
            <option value="lower">偏下</option>
            <option value="center">居中</option>
            <option value="upper">偏上</option>
          </select>
        </div>
        <div class="field">
          <label for="ink">标题颜色</label>
          <select id="ink">
            <option value="white">白字</option>
            <option value="yellow">亮黄</option>
            <option value="dark">深色</option>
          </select>
        </div>
      </div>

      <div class="field">
        <label for="zoom">缩放 <small id="zoomValue">1.00×</small></label>
        <input id="zoom" type="range" min="100" max="220" value="100">
      </div>
      <div class="row">
        <div class="field">
          <label for="panX">左右裁切 <small id="xValue">0</small></label>
          <input id="panX" type="range" min="-100" max="100" value="0">
        </div>
        <div class="field">
          <label for="panY">上下裁切 <small id="yValue">0</small></label>
          <input id="panY" type="range" min="-100" max="100" value="0">
        </div>
      </div>
      <div class="field">
        <label for="safe">预览留白 <small id="safeValue">8%</small></label>
        <input id="safe" type="range" min="4" max="20" value="8">
        <div class="range-meta"><span>紧凑</span><span>宽松</span></div>
      </div>
      <button class="button primary" id="download">导出封面 PNG</button>
      <p class="export-note">导出尺寸随比例切换。虚线与留白遮罩只供预览，不会出现在文件中。</p>
    </section>

    <section class="panel" aria-label="手机预览">
      <h2>手机宽度预览 <small>缩小后看标题是否仍易读</small></h2>
      <div class="preview">
        <div class="canvas-wrap"><canvas id="stage" width="1080" height="1440" aria-label="封面实时预览"></canvas></div>
        <div class="readout">
          <div class="metric"><div class="eyebrow">画布</div><strong id="ratioReadout">3:4</strong></div>
          <div class="metric" id="contrastCard"><div class="eyebrow">标题对比</div><strong><em id="contrast">—</em></strong></div>
          <div class="metric"><div class="eyebrow">图片状态</div><strong><em id="status">示意图</em></strong></div>
        </div>
      </div>
      <div class="disclaimer">这是通用尺寸预览，不是抖音官方裁切模拟；不同页面和设备可能有不同遮挡。它不预测播放量，也不替代在发布页复核。</div>
    </section>
  </div>
  <footer>封面实验室 · 离线单页工具 · 不含上传接口、遥测或第三方字体</footer>
</main>
<script>
(function(){
  "use strict";
  var canvas=document.getElementById("stage"),ctx=canvas.getContext("2d");
  var state={image:null,url:null,width:1080,height:1440,ratio:"3:4",filename:"cover-lab-demo"};
  var $=function(id){return document.getElementById(id)};
  var sample=document.createElement("canvas");
  sample.width=1080;sample.height=1440;
  var s=sample.getContext("2d");
  var bg=s.createLinearGradient(0,0,1080,1440);
  bg.addColorStop(0,"#142342");bg.addColorStop(.55,"#273c69");bg.addColorStop(1,"#08111f");
  s.fillStyle=bg;s.fillRect(0,0,1080,1440);
  s.fillStyle="#71e2c0";s.globalAlpha=.24;s.beginPath();s.arc(890,245,250,0,Math.PI*2);s.fill();s.globalAlpha=1;
  s.fillStyle="#ffffff";s.globalAlpha=.1;s.fillRect(80,100,920,820);s.globalAlpha=1;
  s.strokeStyle="rgba(255,255,255,.24)";s.lineWidth=2;s.strokeRect(114,134,852,752);
  s.fillStyle="#93f2ce";s.font="700 31px -apple-system, PingFang SC, sans-serif";s.fillText("封面检查 · 示意画面",144,200);
  s.fillStyle="rgba(255,255,255,.32)";s.fillRect(145,260,510,24);s.fillRect(145,306,682,24);s.fillRect(145,352,440,24);
  s.fillStyle="#ffd166";s.fillRect(145,770,245,8);s.fillRect(413,770,140,8);
  s.fillStyle="rgba(255,255,255,.6)";s.font="500 27px -apple-system, PingFang SC, sans-serif";s.fillText("选择自己的图片，开始调整",145,840);
  state.image=sample;

  function imageBox(){
    var im=state.image;if(!im)return null;
    var scale=Math.max(state.width/im.width,state.height/im.height)*(Number($("zoom").value)/100);
    var dw=im.width*scale,dh=im.height*scale;
    var extraX=Math.max(0,dw-state.width),extraY=Math.max(0,dh-state.height);
    return {x:(state.width-dw)/2-(Number($("panX").value)/100)*extraX/2,
      y:(state.height-dh)/2-(Number($("panY").value)/100)*extraY/2,w:dw,h:dh};
  }
  function wrapLines(text,maxWidth,font){
    ctx.font=font;
    var lines=[],line="";
    Array.from(text).forEach(function(ch){
      var candidate=line+ch;
      if(line && ctx.measureText(candidate).width>maxWidth){lines.push(line);line=ch}
      else line=candidate;
    });
    if(line)lines.push(line);
    return lines.slice(0,3);
  }
  function textLayout(){
    var margin=state.width*Number($("safe").value)/100;
    var fontSize=Math.round(state.width*.061);
    var font="800 "+fontSize+"px -apple-system, BlinkMacSystemFont, PingFang SC, Microsoft YaHei, sans-serif";
    var title=$("title").value.trim();
    return {margin:margin,fontSize:fontSize,font:font,lines:wrapLines(title,state.width-margin*2,font)};
  }
  function draw(showGuides){
    if(!state.image)return;
    canvas.width=state.width;canvas.height=state.height;
    ctx.clearRect(0,0,state.width,state.height);
    var b=imageBox();
    ctx.drawImage(state.image,b.x,b.y,b.w,b.h);

    var lay=textLayout(),pos=$("position").value;
    var blockHeight=lay.lines.length*lay.fontSize*1.23;
    var top=pos==="upper"?state.height*.24:pos==="center"?(state.height-blockHeight)/2:state.height*.70-blockHeight/2;
    var color=$("ink").value==="yellow"?"#ffe177":$("ink").value==="dark"?"#09111e":"#ffffff";
    if(pos==="lower"){
      var grad=ctx.createLinearGradient(0,state.height*.48,0,state.height);
      grad.addColorStop(0,"rgba(4,9,18,0)");grad.addColorStop(1,"rgba(4,9,18,.82)");
      ctx.fillStyle=grad;ctx.fillRect(0,state.height*.48,state.width,state.height*.52);
    }else{
      ctx.fillStyle="rgba(4,9,18,.27)";
      var h=blockHeight+lay.margin*.75;ctx.fillRect(0,Math.max(0,top-lay.margin*.35),state.width,h);
    }
    var luminance=sampleLuminance(lay,pos,top,blockHeight);
    ctx.font=lay.font;ctx.textBaseline="top";ctx.textAlign="left";
    ctx.lineJoin="round";ctx.lineWidth=Math.max(4,lay.fontSize*.14);
    ctx.strokeStyle="rgba(0,0,0,.50)";ctx.fillStyle=color;
    var y=top;
    lay.lines.forEach(function(line){ctx.strokeText(line,lay.margin,y,state.width-lay.margin*2);ctx.fillText(line,lay.margin,y,state.width-lay.margin*2);y+=lay.fontSize*1.23;});

    var contrast=$("ink").value==="dark"?(luminance>0.179?"较好":"偏低"):(luminance<0.48?"较好":"偏低");
    $("contrast").textContent=contrast;
    $("contrastCard").classList.toggle("warn",contrast==="偏低");
    if(showGuides){
      var safe=lay.margin;
      ctx.save();
      ctx.fillStyle="rgba(3,8,15,.3)";
      ctx.fillRect(0,0,state.width,safe);
      ctx.fillRect(0,state.height-safe,state.width,safe);
      ctx.fillRect(0,safe,safe,state.height-safe*2);
      ctx.fillRect(state.width-safe,safe,safe,state.height-safe*2);
      ctx.setLineDash([14,12]);ctx.lineWidth=4;ctx.strokeStyle="rgba(110,231,192,.92)";
      ctx.strokeRect(safe,safe,state.width-safe*2,state.height-safe*2);
      ctx.setLineDash([]);ctx.font="600 26px sans-serif";ctx.fillStyle="#8af5d5";
      ctx.fillText("预览留白边界",safe+10,safe+12);
      ctx.restore();
    }
  }
  function sampleLuminance(layout,pos,top,blockHeight){
    var x=Math.min(state.width-1,Math.max(0,Math.round(layout.margin+10)));
    var y=Math.min(state.height-1,Math.max(0,Math.round(top+blockHeight*.55)));
    var w=Math.min(state.width-x,Math.max(1,Math.round(state.width-layout.margin*2-20)));
    var h=Math.min(state.height-y,Math.max(1,Math.round(layout.fontSize*.45)));
    try{
      var data=ctx.getImageData(x,y,w,h).data,sum=0,count=0;
      for(var i=0;i<data.length;i+=4){
        var r=data[i]/255,g=data[i+1]/255,b=data[i+2]/255;
        var lin=[r,g,b].map(function(v){return v<=.04045?v/12.92:Math.pow((v+.055)/1.055,2)});
        sum+=.2126*lin[0]+.7152*lin[1]+.0722*lin[2];count++;
      }
      return count?sum/count:.5;
    }catch(e){return .5}
  }
  function redraw(){
    $("count").textContent=Array.from($("title").value).length;
    $("safeValue").textContent=$("safe").value+"%";
    $("zoomValue").textContent=(Number($("zoom").value)/100).toFixed(2)+"×";
    $("xValue").textContent=$("panX").value;
    $("yValue").textContent=$("panY").value;
    draw(true);
  }
  function setRatio(ratio){
    state.ratio=ratio;
    state.width=1080;state.height=ratio==="3:4"?1440:1920;
    canvas.width=state.width;canvas.height=state.height;
    $("ratio34").setAttribute("aria-pressed",ratio==="3:4"?"true":"false");
    $("ratio916").setAttribute("aria-pressed",ratio==="9:16"?"true":"false");
    $("sizeLabel").textContent=state.width+" × "+state.height;
    $("ratioReadout").textContent=ratio;
    redraw();
  }
  $("ratio34").addEventListener("click",function(){setRatio("3:4")});
  $("ratio916").addEventListener("click",function(){setRatio("9:16")});
  ["title","position","ink","zoom","panX","panY","safe"].forEach(function(id){
    $(id).addEventListener(id==="title"?"input":"change",redraw);
    if(id==="zoom"||id==="panX"||id==="panY"||id==="safe")$(id).addEventListener("input",redraw);
  });
  $("file").addEventListener("change",function(e){loadFile(e.target.files[0])});
  function loadFile(file){
    if(!file)return;
    if(!["image/jpeg","image/png","image/webp"].includes(file.type)){
      alert("请选择 JPG、PNG 或 WebP 图片。");$("file").value="";return;
    }
    if(file.size>15*1024*1024){alert("图片超过 15 MB，请先压缩后重试。");$("file").value="";return;}
    var url=URL.createObjectURL(file),im=new Image();
    im.onload=function(){
      if(state.url)URL.revokeObjectURL(state.url);
      state.url=url;state.image=im;state.filename=file.name.replace(/\.[^.]+$/,"")||"cover";
      $("status").textContent="已载入";
      $("zoom").value=100;$("panX").value=0;$("panY").value=0;
      redraw();
    };
    im.onerror=function(){URL.revokeObjectURL(url);alert("图片读取失败，请换一张常见格式的图片。")};
    im.src=url;
  }
  $("drop").addEventListener("dragover",function(e){e.preventDefault();$("drop").classList.add("over")});
  $("drop").addEventListener("dragleave",function(){$("drop").classList.remove("over")});
  $("drop").addEventListener("drop",function(e){e.preventDefault();$("drop").classList.remove("over");loadFile(e.dataTransfer.files[0])});
  $("download").addEventListener("click",function(){
    draw(false);
    canvas.toBlob(function(blob){
      if(!blob){redraw();return}
      var a=document.createElement("a"),url=URL.createObjectURL(blob);
      a.href=url;a.download=state.filename+"-"+state.ratio.replace(":","x")+".png";
      document.body.appendChild(a);a.click();a.remove();
      setTimeout(function(){URL.revokeObjectURL(url);redraw()},1200);
    },"image/png");
  });
  window.addEventListener("beforeunload",function(){if(state.url)URL.revokeObjectURL(state.url)});
  redraw();
})();
</script>
</body>
</html>
